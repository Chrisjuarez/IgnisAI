# render.yaml — IgnisAI Render Blueprint
# https://render.com/docs/blueprint-spec
#
# After first deploy, update these env vars in the Render dashboard:
#   1. ignisai-backend:  TILE_SVC    → https://ignisai-tilesvc.onrender.com
#   2. ignisai-backend:  CORS_ORIGIN → https://ignisai-frontend.onrender.com
#   3. ignisai-frontend: REACT_APP_API_URL → https://ignisai-backend.onrender.com/api
# Then trigger a manual deploy on the frontend to rebuild with the new API URL.

services:
  # ---- React Frontend (Free Static Site) ----
  - type: web
    name: ignisai-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://ignisai-backend.onrender.com/api
      - key: REACT_APP_MAPBOX_TOKEN
        sync: false # Your Mapbox access token
      - key: NODE_VERSION
        value: "20"

  # ---- Node/Express Backend (Free Web Service) ----
  - type: web
    name: ignisai-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node app.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false # MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true
      - key: FIRMS_API_KEY
        sync: false # NASA FIRMS API key
      - key: TILE_SVC
        sync: false # Set to https://ignisai-tilesvc.onrender.com after tilesvc deploys
      - key: CORS_ORIGIN
        value: https://ignisai-frontend.onrender.com

  # ---- Python/FastAPI Tile Service (Starter $7/mo) ----
  - type: web
    name: ignisai-tilesvc
    env: docker
    plan: starter
    dockerfilePath: docker/tilesvc.Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: MODEL_PATH
        value: /app/models/convlstm_unet_v3_delta_Cd13_Cs15_H64_T6_nautilus.pt
      - key: NASA_API_KEY
        sync: false # NASA FIRMS API key (same key as FIRMS_API_KEY above)
      - key: MODEL_URL
        sync: false # URL to download model .pt file (if not baked into Docker image)
      - key: MODEL_SHA256
        sync: false # Optional checksum; accepts bare hex or sha256:<hex>
      - key: STATIC_CATALOG_PATH
        value: /app/config/static_catalog.production.json
      - key: STATIC_CATALOG_REQUIRED
        value: "0"
      - key: AWS_REGION
        sync: false # Region for private S3 static COG reads
      - key: AWS_ACCESS_KEY_ID
        sync: false # IAM user/role with read access to IGNIS_STATIC_BUCKET
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: IGNIS_STATIC_BUCKET
        sync: false # Bucket containing generated static COGs
      - key: IGNIS_STATIC_PREFIX
        value: ignis/static
      - key: CALIBRATION_REQUIRED
        value: "0"
      - key: TORCH_DEVICE
        value: cpu
      - key: CORS_ORIGIN
        sync: false # Set to https://ignisai-frontend.onrender.com
