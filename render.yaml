# render.yaml — IgnisAI Render Blueprint
# https://render.com/docs/blueprint-spec
#
# After first deploy, update these env vars in the Render dashboard:
#   1. ignisai-backend:  TILE_SVC    → https://ignisai-tilesvc.onrender.com
#   2. ignisai-backend:  CORS_ORIGIN → https://ignisai-frontend.onrender.com
#   3. ignisai-frontend: REACT_APP_API_URL → https://ignisai-backend.onrender.com/api
# Then trigger a manual deploy on the frontend to rebuild with the new API URL.

services:
  # ---- React Frontend (Free Static Site) ----
  - type: web
    name: ignisai-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    # The app routes client-side, so every path except / is a route rather than
    # a file. Without this the host looks for a file that was never built and
    # serves its own 404 - which is what a reload on /dashboard hit. The app
    # only ever survived being opened at the root.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://ignisai-backend.onrender.com/api
      - key: REACT_APP_MAPBOX_TOKEN
        sync: false # Your Mapbox access token
      - key: NODE_VERSION
        value: "20"

  # ---- Node/Express Backend (Free Web Service) ----
  - type: web
    name: ignisai-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node app.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false # MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true
      # Standardized name. Old `FIRMS_API_KEY` was unused by the codebase
      # (which reads NASA_API_KEY). Don't reintroduce the old name.
      - key: NASA_API_KEY
        sync: false # NASA FIRMS API key (https://firms.modaps.eosdis.nasa.gov/api/)
      - key: TILE_SVC
        sync: false # Set to https://ignisai-tilesvc.onrender.com after tilesvc deploys
      - key: CORS_ORIGIN
        value: https://ignisai-frontend.onrender.com
      # Bound the in-memory map bootstrap cache so a long-uptime instance
      # cannot OOM. The byte budget is the real bound - entries range from
      # ~0.4 MB for a city bbox to far more at full extent, so counting them
      # was never the right unit. This pinned 200 and silently overrode the
      # code default of 12.
      - key: MAP_BOOTSTRAP_CACHE_MS
        value: "180000"
      - key: MAP_BOOTSTRAP_CACHE_MAX
        value: "12"
      - key: MAP_BOOTSTRAP_CACHE_BYTES
        value: "67108864"

  # ---- Python/FastAPI Tile Service (Starter $7/mo) ----
  - type: web
    name: ignisai-tilesvc
    env: docker
    plan: starter
    dockerfilePath: docker/tilesvc.Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      # control60, not v3. Scored on identical held-out NDWS cells the two are
      # not close: AP 0.808 vs 0.256, best CSI 0.567 vs 0.213, and v3's Brier
      # skill is -1.409 - worse than always predicting the base rate. v3's
      # higher published CSI came from a split that was never recorded as
      # group-aware, so consecutive days of one fire sat in both train and
      # validation; every RunPod run used group_aware and measured honestly.
      #
      # Tseq, threshold and channel order all come from the checkpoint, so
      # swapping the file carries the T6 -> T3 change with it.
      - key: MODEL_PATH
        value: /app/models/convlstm_unet_ft_rollout_Cd13_Cs15_H64_T3.pt
      - key: REQUIRED_ARCH_VERSION
        value: v3
      - key: NASA_API_KEY
        sync: false # NASA FIRMS API key (same key as FIRMS_API_KEY above)
      # Public release asset and its checksum - neither is a secret, and holding
      # them here rather than in dashboard state keeps the model identity under
      # version control next to the calibration fitted for it. A mismatch is
      # then a diff rather than an invisible drift.
      - key: MODEL_URL
        value: https://github.com/Chrisjuarez/IgnisAI/releases/download/v1.0.0/convlstm_unet_ft_rollout_Cd13_Cs15_H64_T3.pt
      - key: MODEL_SHA256
        value: 793d9fe3ff6d1e55fc22bdccd3f2eb6febd8522753ac91db5e81a5222b3fc354
      - key: STATIC_CATALOG_PATH
        value: /app/config/static_catalog.production.json
      - key: STATIC_CATALOG_REQUIRED
        value: "1"
      - key: AWS_REGION
        sync: false # Region for private S3 static COG reads
      - key: AWS_ACCESS_KEY_ID
        sync: false # IAM user/role with read access to IGNIS_STATIC_BUCKET
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: IGNIS_STATIC_BUCKET
        sync: false # Bucket containing generated static COGs
      - key: IGNIS_STATIC_PREFIX
        value: ignis/static
      - key: IGNIS_RUNTIME_CACHE_BUCKET
        value: s3://ignisai-static-chrisjuarez-2026/runtime
      # palisades_full spans 2025-01-01..01-10, so one cache serves both the
      # ignition-time preset (ref 01-07, which needs six frames back to 01-02)
      # and a mid-fire reference three days in. The older `palisades` profile
      # stopped at 01-07 and `palisades_mid` started at 01-04, so neither
      # covers both - switching to _mid would have silently dropped two frames
      # from the ignition preset.
      #
      # One profile per service, deliberately. Snapshot files are named by date
      # but scoped to the event's bounding box, so two profiles sharing these
      # directories would overwrite each other.
      - key: IGNIS_RUNTIME_CACHE_PROFILE
        value: palisades_full
      - key: IGNIS_RUNTIME_CACHE_REQUIRED
        value: "0"
      # Calibrated probabilities, not raw sigmoid scores. Without a calibration
      # loaded the service maps scores through the identity curve, so a
      # displayed "0.7" was whatever the network emitted rather than a claim
      # that seven in ten such cells burn. Measured on held-out tiles the
      # difference is large: Brier 0.031 -> 0.015, skill 0.147 -> 0.597,
      # expected calibration error 0.036 -> 0.003.
      #
      # The file names the checkpoint sha it was fitted for and the loader
      # rejects a mismatch, so the pairing cannot drift silently.
      - key: CALIBRATION_PATH
        value: /app/config/calibration.ft_none.json
      # Required, so an uncalibrated deploy fails loudly instead of quietly
      # serving uncalibrated numbers as probabilities. That distinction is the
      # whole point for anything priced off these outputs.
      - key: CALIBRATION_REQUIRED
        value: "1"
      # Production runs with this on; the blueprint said "0" while the
      # dashboard said "1", which made the served weather source impossible to
      # reason about from the repo. Off means the cached NOAA grids are never
      # read and every prediction silently uses the Open-Meteo fallback.
      - key: NOAA_GRIB_ENABLED
        value: "1"
      - key: NOAA_GRID_CACHE_DIR
        value: /data/noaa_grid_cache
      - key: NOAA_GRID_CACHE_TEMPLATE
        value: /data/noaa_grid_cache/{iso_hour}_{lat}_{lon}.npz
      - key: FIRMS_SNAPSHOT_DIR
        value: /data/firms_snapshots
      - key: FIRMS_SNAPSHOT_REQUIRED
        value: "0"
      - key: PRED_DISPLAY_FLOOR
        value: "0.10"
      - key: PRED_SMOOTH_SIGMA
        value: "0.5"
      - key: PRED_UPSCALE
        value: "8"
      - key: TORCH_DEVICE
        value: cpu
      - key: CORS_ORIGIN
        sync: false # Set to https://ignisai-frontend.onrender.com
