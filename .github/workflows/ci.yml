name: Node CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  schedule:
    - cron: '0 9 * * 1' # Weekly schedule at 9:00 UTC on Mondays, could possibly remove if we only want CI running on push/PR

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      JWT_SECRET: test-secret-key-for-ci-cd-very-long-and-secure
      JWT_EXPIRES_IN: 7d
      MONGODB_TEST_URI: mongodb://localhost:27017/ignisai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'
      - run: npm ci
      - run: npm run lint --if-present
      # run jest in CI mode; if you configured coverage in jest.config.cjs it will generate ./coverage
      - run: npm test -- --ci --reporters=default --passWithNoTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore
      - run: npm run build --if-present
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-build
          path: backend/**/dist/*
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - run: npm ci
      - run: npm run lint --if-present
      # CRA/jest needs CI=true to avoid watch prompts
      - run: CI=true npm test -- --watchAll=false --passWithNoTests
      - run: npm run build --if-present
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-build
          path: frontend/build
          if-no-files-found: ignore

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3