name: Node CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  schedule:
    - cron: '0 9 * * 1'  # weekly sanity run

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    services:
      mongodb:
        image: mongo:6.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "bash -lc 'echo > /dev/tcp/127.0.0.1/27017'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      MONGODB_TEST_URI: mongodb://localhost:27017/ignisai_test
      JWT_SECRET: test-secret-key-for-ci-minimum-32-characters-long
      JWT_EXPIRES_IN: 7d
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Wait for MongoDB
        run: |
          for i in {1..60}; do
            (echo >/dev/tcp/127.0.0.1/27017) && exit 0
            echo "Waiting for MongoDB..."; sleep 2
          done
          echo "MongoDB failed to start"
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint --if-present
        continue-on-error: true

      - name: Run tests
        run: npm test -- --ci --coverage --reporters=default --passWithNoTests
        continue-on-error: false

      - name: Generate coverage report
        if: always()
        run: |
          if [ -d "coverage" ]; then
            echo "## Backend Test Coverage" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat coverage/coverage-summary.txt 2>/dev/null || echo "Coverage summary not available"
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: ignore

      - name: Build backend
        run: CI=false npm run build --if-present

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/**/dist/*
          if-no-files-found: ignore

      # Docker build and push (main branch only)
      - name: Setup Docker Buildx
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Owner lowercase
        if: github.ref == 'refs/heads/main'
        run: echo "OWNER_LC=$(echo $GITHUB_REPOSITORY_OWNER | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push backend Docker image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/ignisai-backend:latest
            ghcr.io/${{ env.OWNER_LC }}/ignisai-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint --if-present
        continue-on-error: true

      - name: Run tests
        run: CI=true npm test -- --coverage --watchAll=false --passWithNoTests
        continue-on-error: false

      - name: Generate coverage report
        if: always()
        run: |
          if [ -d "coverage" ]; then
            echo "## Frontend Test Coverage" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat coverage/coverage-summary.txt 2>/dev/null || echo "Coverage summary not available"
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

      - name: Build frontend
        run: CI=false npm run build --if-present

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          if-no-files-found: ignore

      # Docker build and push (main branch only)
      - name: Setup Docker Buildx
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Owner lowercase
        if: github.ref == 'refs/heads/main'
        run: echo "OWNER_LC=$(echo $GITHUB_REPOSITORY_OWNER | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push frontend Docker image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/ignisai-frontend:latest
            ghcr.io/${{ env.OWNER_LC }}/ignisai-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

  trivy:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner (Backend)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: fs
          scan-ref: ./backend
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: backend-trivy.sarif

      - name: Upload Backend Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: backend-trivy.sarif
          category: backend-trivy

      - name: Run Trivy vulnerability scanner (Frontend)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: fs
          scan-ref: ./frontend
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: frontend-trivy.sarif

      - name: Upload Frontend Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: frontend-trivy.sarif
          category: frontend-trivy

      - name: Generate Trivy summary
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "Trivy scans completed for backend and frontend" >> $GITHUB_STEP_SUMMARY
          echo "Check the Security tab for detailed results" >> $GITHUB_STEP_SUMMARY

  test-summary:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Generate Test Summary
        run: |
          echo "# IgnisAI CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: ${{ needs.backend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ${{ needs.frontend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View detailed coverage reports in the artifacts section." >> $GITHUB_STEP_SUMMARY