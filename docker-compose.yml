version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks: [ignisai-network]
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/ignisai --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  tilesvc:
    build:
      context: .
      dockerfile: docker/tilesvc.Dockerfile
      args:
        INSTALL_TORCH: "1"   # <-- IMPORTANT
    env_file:
      - docker/tilesvc.env
    ports:
      - "8008:8008"
    environment:
      # point to YOUR model filename
      MODEL_PATH: /models/convlstm_unet_Cd7_Cs15_H96_T6_nautilus.pt
      TORCH_DEVICE: cpu
       # optional but recommended: make config explicit
      MODEL_CD: "7"
      MODEL_CS: "15"
      MODEL_HIDDEN: "96"
      MODEL_LSTM_LAYERS: "1"
      MODEL_THRESHOLD: "0.07"     # tune later (0.25–0.6)
    volumes:
      - ./models:/models
    restart: unless-stopped
    networks:
      - ignisai-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/ignisai
      PORT: 5000
      CORS_ORIGIN: http://localhost:3000
      TILE_SVC: http://tilesvc:8008
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
      tilesvc:
        condition: service_started
    networks: [ignisai-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:5000/api
        REACT_APP_MAPBOX_TOKEN: ${REACT_APP_MAPBOX_TOKEN}
    environment:
      - REACT_APP_MAPBOX_TOKEN=${REACT_APP_MAPBOX_TOKEN}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [ignisai-network]
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  ignisai-network:
    driver: bridge