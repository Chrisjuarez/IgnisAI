version: '3.8'
services:
  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks: [ignisai-network]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      # when running in compose, talk to the compose mongo host
      MONGODB_URI: mongodb://mongodb:27017/ignisai
      PORT: 5000
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on: [mongodb]
    networks: [ignisai-network]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:5000/api
    ports:
      - "3000:80"
    depends_on: [backend]
    networks: [ignisai-network]

volumes:
  mongo_data:

networks:
  ignisai-network:
    driver: bridge