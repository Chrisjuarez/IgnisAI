version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks: [ignisai-network]
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/ignisai --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  tilesvc:
    build:
      context: .
      dockerfile: docker/tilesvc.Dockerfile
    env_file:
      - ./docker/tilesvc.env
    environment:
      - MODEL_PATH=/models/model.pt
    volumes:
      - ./models:/models:ro
    ports:
      - "8008:8008"
    networks: [ignisai-network]
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/ignisai
      PORT: 5000
      CORS_ORIGIN: http://localhost:3000
      TILE_SVC: http://tilesvc:8008
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
      tilesvc:
        condition: service_started
    networks: [ignisai-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:5000/api
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [ignisai-network]
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  ignisai-network:
    driver: bridge