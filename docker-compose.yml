version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks: [ignisai-network]
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/ignisai --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  tilesvc:
    build:
      context: .
      dockerfile: docker/tilesvc.Dockerfile
      args:
        INSTALL_TORCH: "1"   # <-- IMPORTANT
    env_file:
      - docker/tilesvc.env
    ports:
      - "8008:8008"
    environment:
      # v3 delta checkpoint can be baked into ./models or downloaded from GitHub Releases.
      MODEL_PATH: /models/convlstm_unet_v3_delta_Cd13_Cs15_H64_T6_nautilus.pt
      MODEL_URL: ${MODEL_URL:-}
      MODEL_SHA256: ${MODEL_SHA256:-}
      MODEL_CONFIG_PATH: /app/services/tilesvc/model_config.default.json
      TORCH_DEVICE: cpu
      IGNIS_ML_SOURCE_PATH: /app/ignis_ml_source
      INSTALL_IGNIS_ML: "1"
      REQUIRED_ARCH_VERSION: v3
      REQUIRED_TARGET_MODE: delta
      STATIC_CATALOG_PATH: ${STATIC_CATALOG_PATH:-/app/config/static_catalog.production.json}
      STATIC_CATALOG_REQUIRED: ${STATIC_CATALOG_REQUIRED:-0}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      IGNIS_STATIC_BUCKET: ${IGNIS_STATIC_BUCKET:-}
      IGNIS_STATIC_PREFIX: ${IGNIS_STATIC_PREFIX:-ignis/static}
      CALIBRATION_PATH: ${CALIBRATION_PATH:-}
      CALIBRATION_REQUIRED: ${CALIBRATION_REQUIRED:-1}
      NOAA_GRIB_ENABLED: ${NOAA_GRIB_ENABLED:-0}
      NOAA_GRID_CACHE_DIR: ${NOAA_GRID_CACHE_DIR:-/data/noaa_grid_cache}
      FIRMS_SNAPSHOT_DIR: ${FIRMS_SNAPSHOT_DIR:-/data/firms_snapshots}
      FIRMS_SNAPSHOT_REQUIRED: ${FIRMS_SNAPSHOT_REQUIRED:-0}
      PREDICTION_CACHE_DIR: ${PREDICTION_CACHE_DIR:-/data/prediction_cache}
      PREDICTIONS_ENABLED: ${PREDICTIONS_ENABLED:-true}
      # optional but recommended: make config explicit; checkpoint metadata wins.
      MODEL_CD: "13"
      MODEL_CS: "15"
      MODEL_HIDDEN: "64"
      MODEL_LSTM_LAYERS: "2"
      MODEL_TSEQ: "6"
      MODEL_STEP_HOURS: "24"
      MODEL_DYNAMIC_ORDER: "fire_t,u,v,gust,tempC,q,precip"
      MODEL_STATIC_ORDER: "elev,slope,aspect_cos,aspect_sin,ndvi,bi,erc,pdsi,chili,impervious,water,population,fuel1,fuel2,fuel3"
      MODEL_DERIVED_FEATURES_ENABLE: "true"
      MODEL_THRESHOLD: "0.5"
    volumes:
      - ./models:/models
      - ./config:/app/config:ro
      - ../ignis_ml_nautilus:/app/ignis_ml_source:ro
      - ./data/firms_snapshots:/data/firms_snapshots
      - ./data/noaa_grid_cache:/data/noaa_grid_cache
      - ./data/prediction_cache:/data/prediction_cache
    restart: unless-stopped
    networks:
      - ignisai-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/ignisai
      PORT: 5000
      CORS_ORIGIN: http://localhost:3000
      TILE_SVC: http://tilesvc:8008
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
      tilesvc:
        condition: service_started
    networks: [ignisai-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:5000/api
        REACT_APP_MAPBOX_TOKEN: ${REACT_APP_MAPBOX_TOKEN}
    environment:
      - REACT_APP_MAPBOX_TOKEN=${REACT_APP_MAPBOX_TOKEN}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [ignisai-network]
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  ignisai-network:
    driver: bridge
